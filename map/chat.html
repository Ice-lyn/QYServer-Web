<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QYServer | 服务器聊天室</title>
    <link rel="stylesheet" href="/lib/all.css">
    <script src="/lib/AllComponents.js"></script>
    <style>
        /* 聊天室容器 */
        #chatContainer {
            max-width: 900px;
            margin: 80px auto 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 70vh;
            min-height: 500px;
        }

        /* 登录面板 */
        #loginPanel {
            padding: 40px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
        }

        #loginPanel h3 {
            color: #333;
            margin-bottom: 25px;
            font-size: 1.4rem;
        }

        #loginPanel input {
            display: block;
            width: 280px;
            margin: 0 auto 12px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        #loginPanel button {
            width: 280px;
            padding: 10px;
            background: #f8a5c2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        #loginPanel button:hover {
            background: #f78fb3;
        }

        .login-error {
            color: #e74c3c;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }

        /* 聊天主面板 */
        #chatPanel {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 消息列表 */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(250, 250, 250, 0.8);
        }

        .msg-item {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .msg-meta {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .msg-meta .name {
            font-weight: 600;
            color: #a56de2;
        }

        .msg-meta .time {
            color: #bbb;
        }

        .msg-content {
            background: white;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            word-break: break-word;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            line-height: 1.5;
        }

        .msg-item.system .msg-content {
            background: transparent;
            box-shadow: none;
            color: #888;
            font-style: italic;
            max-width: 100%;
        }

        .msg-item.self .msg-content {
            background: #f8a5c2;
            color: white;
            margin-left: auto;
        }

        .msg-item.self .msg-meta {
            justify-content: flex-end;
        }

        /* 输入区域 */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #eee;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
        }

        .input-area button {
            padding: 10px 25px;
            background: #f8a5c2;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .input-area button:hover {
            background: #f78fb3;
        }

        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* 系统消息样式 */
        .msg-system {
            text-align: center;
            margin: 10px 0;
        }

        .msg-system .msg-content {
            background: transparent !important;
            color: #999 !important;
            font-size: 0.9rem;
            max-width: 100% !important;
            box-shadow: none !important;
        }

        @media (max-width: 768px) {
            #chatContainer {
                margin: 70px 10px 20px;
                height: 75vh;
            }

            #loginPanel input,
            #loginPanel button {
                width: 240px;
            }
        }

        /* 🟢 在线列表按钮 */
        .online-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 20px;
            background: rgba(248, 165, 194, 0.08);
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
        }

        .online-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.85rem;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .online-btn:hover {
            background: #f8a5c2;
            color: white;
            border-color: #f8a5c2;
        }

        .online-count {
            font-weight: 600;
            color: #a56de2;
        }

        .online-btn:hover .online-count {
            color: white;
        }

        /* 🟢 在线列表面板 */
        .online-panel {
            display: none;
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid #eee;
            max-height: 200px;
            overflow-y: auto;
        }

        .online-panel.show {
            display: block;
        }

        .online-section {
            margin-bottom: 10px;
        }

        .online-section:last-child {
            margin-bottom: 0;
        }

        .online-section-title {
            font-size: 0.8rem;
            color: #999;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .online-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .online-tag {
            background: rgba(248, 165, 194, 0.1);
            color: #a56de2;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .online-tag .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #27ae60;
        }

        .online-empty {
            font-size: 0.85rem;
            color: #bbb;
            font-style: italic;
        }

        /* 🟢 在线列表按钮栏 */
        .online-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 20px;
            background: rgba(255, 255, 255, 0.6);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
        }

        .online-btn {
            background: none;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.8rem;
            color: #888;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .online-btn:hover {
            background: #f8a5c2;
            color: white;
            border-color: #f8a5c2;
        }

        .online-btn.active {
            background: #f8a5c2;
            color: white;
            border-color: #f8a5c2;
        }

        .online-count {
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* 🟢 在线详情面板 */
        .online-detail-panel {
            padding: 10px 20px;
            background: white;
            border-top: 1px solid #eee;
            max-height: 150px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .online-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .online-tag {
            background: rgba(248, 165, 194, 0.1);
            color: #a56de2;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .online-tag .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .online-empty {
            font-size: 0.8rem;
            color: #bbb;
            font-style: italic;
        }

        /* 🟢 隐藏页脚 */
        #footer {
            display: none !important;
        }

        /* 🟢 右上角弹窗动画 */
        @keyframes chatToastIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes chatToastOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }

            to {
                opacity: 0;
                transform: translateX(120%);
            }
        }
    </style>
</head>

<body>
    <!-- 内容区域（导航栏和页脚由AllComponents.js自动生成） -->
    <div id="chatContainer">
        <!-- 登录面板（默认显示） -->
        <div id="loginPanel">
            <h3><i class="fas fa-lock" style="margin-right:8px;color:#a56de2;"></i>登录聊天室</h3>
            <input type="text" id="loginUsername" placeholder="游戏ID" autocomplete="username">
            <input type="password" id="loginPassword" placeholder="网页密码（游戏内/bdslm设置）" autocomplete="current-password">
            <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> 登录</button>
            <div id="loginError" class="login-error"></div>
        </div>

        <!-- 聊天面板（登录后显示） -->
        <div id="chatPanel" style="display:none;">
            <!-- 消息区域 -->
            <div id="messages"></div>

            <!-- 🟢 在线列表按钮栏（消息下方、输入框上方） -->
            <div class="online-bar" id="onlineBar">
                <button class="online-btn" id="onlineBtn" title="服务器在线列表">
                    <i class="fas fa-gamepad"></i>
                    <span class="online-count" id="gameCount">-</span>
                </button>
                <button class="online-btn" id="webOnlineBtn" title="网页在线列表">
                    <i class="fas fa-globe"></i>
                    <span class="online-count" id="webCount">-</span>
                </button>
                <span style="flex:1;"></span>
                <span style="font-size:0.8rem;color:#bbb;" id="onlineRefreshTime"></span>
            </div>

            <!-- 🟢 在线详情弹出面板（点击按钮后在此显示） -->
            <div class="online-detail-panel" id="onlineDetailPanel" style="display:none;">
                <div class="online-tags" id="onlineDetailTags"></div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="输入消息，按回车发送..." maxlength="100">
                <button id="sendBtn"><i class="fas fa-paper-plane"></i> 发送</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const FETCH_INTERVAL = 2000;
            const HEARTBEAT_INTERVAL = 60000;

            const loginPanel = document.getElementById('loginPanel');
            const chatPanel = document.getElementById('chatPanel');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const messagesEl = document.getElementById('messages');
            const chatInput = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');

            const gameBtn = document.getElementById('onlineBtn');
            const webBtn = document.getElementById('webOnlineBtn');
            const detailPanel = document.getElementById('onlineDetailPanel');
            const detailTags = document.getElementById('onlineDetailTags');
            const gameCountEl = document.getElementById('gameCount');
            const webCountEl = document.getElementById('webCount');
            const refreshTimeEl = document.getElementById('onlineRefreshTime');

            let onlineTimer = null;
            let currentOnlineTab = null; // 'game' | 'web'

            let currentUser = null;
            let lastRefreshTime = 0;
            let fetchTimer = null;
            let heartbeatTimer = null;

            // 🟢 在线列表按钮点击
            gameBtn.addEventListener('click', () => toggleOnlinePanel('game'));
            webBtn.addEventListener('click', () => toggleOnlinePanel('web'));

            async function toggleOnlinePanel(type) {
                if (currentOnlineTab === type && detailPanel.style.display === 'block') {
                    // 再次点击同一个按钮，关闭面板
                    detailPanel.style.display = 'none';
                    gameBtn.classList.remove('active');
                    webBtn.classList.remove('active');
                    currentOnlineTab = null;
                    return;
                }

                currentOnlineTab = type;
                detailPanel.style.display = 'block';

                if (type === 'game') {
                    gameBtn.classList.add('active');
                    webBtn.classList.remove('active');
                } else {
                    webBtn.classList.add('active');
                    gameBtn.classList.remove('active');
                }

                await fetchOnlineDetail(type);
            }

            async function fetchOnlineDetail(type) {
                try {
                    const url = type === 'game'
                        ? 'https://map.qyserver.top/api/playerlist'
                        : 'https://map.qyserver.top/api/webOnline';
                    const res = await fetch(url);
                    const data = await res.json();

                    if (Array.isArray(data) && data.length > 0) {
                        const dotColor = type === 'game' ? '#27ae60' : '#3498db';
                        detailTags.innerHTML = data.map(name =>
                            `<span class="online-tag">
                                <span class="dot" style="background:${dotColor};"></span>${escapeHtml(name)}
                            </span>`
                        ).join('');
                    } else {
                        const label = type === 'game' ? '暂无玩家在线' : '暂无网页用户';
                        detailTags.innerHTML = `<span class="online-empty">${label}</span>`;
                    }
                } catch (e) {
                    detailTags.innerHTML = '<span class="online-empty">加载失败</span>';
                }
            }

            // 🟢 定期更新在线人数
            async function updateOnlineCounts() {
                try {
                    const [gameRes, webRes] = await Promise.all([
                        fetch('https://map.qyserver.top/api/playerlist'),
                        fetch('https://map.qyserver.top/api/webOnline')
                    ]);
                    const gamePlayers = await gameRes.json();
                    const webPlayers = await webRes.json();

                    gameCountEl.textContent = "服务器在线 " + (Array.isArray(gamePlayers) ? gamePlayers.length : '-');
                    webCountEl.textContent = "网页在线 " + (Array.isArray(webPlayers) ? webPlayers.length : '-');

                    const now = new Date();
                    refreshTimeEl.textContent = `刷新
                        ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                } catch (e) {
                    gameCountEl.textContent = '-';
                    webCountEl.textContent = '-';
                }
            }

            // ==================== MC 颜色符号解析 ====================
            const MC_COLORS = {
                "§0": "#000000",
                "§1": "#0000AA",
                "§2": "#00AA00",
                "§3": "#00AAAA",
                "§4": "#AA0000",
                "§5": "#AA00AA",
                "§6": "#FFAA00",
                "§7": "#AAAAAA",
                "§8": "#555555",
                "§9": "#5555FF",
                "§a": "#55FF55",
                "§b": "#55FFFF",
                "§c": "#FF5555",
                "§d": "#FF55FF",
                "§e": "#FFFF55",
                "§f": "#FFFFFF"
            };

            const MC_STYLES = {
                "§k": "",           // obfuscated - 跳过
                "§l": "font-weight:bold;",
                "§m": "text-decoration:line-through;",
                "§n": "text-decoration:underline;",
                "§o": "font-style:italic;",
                "§r": ""            // 重置
            };

            /**
             * 解析 MC 颜色符号，返回带 style 属性的 HTML
             * @param {string} text - 原始文本
             * @returns {string} 带颜色和样式的 HTML
             */
            function parseMcColors(text) {
                if (!text || !text.includes('§')) {
                    return escapeHtml(text || '');
                }

                let result = '';
                let currentColor = '';
                let currentStyles = [];
                let currentText = '';
                let i = 0;

                while (i < text.length) {
                    if (text[i] === '§' && i + 1 < text.length) {
                        // 🟢 遇到 § 符号，先把之前攒的文本输出
                        if (currentText) {
                            result += buildSpan(currentColor, currentStyles, currentText);
                            currentText = '';
                        }

                        const code = text.substring(i, i + 2);

                        // 颜色代码
                        if (MC_COLORS[code]) {
                            currentColor = MC_COLORS[code];
                            currentStyles = [];
                            i += 2;
                            continue;
                        }

                        // 重置
                        if (code === '§r') {
                            currentColor = '';
                            currentStyles = [];
                            i += 2;
                            continue;
                        }

                        // 样式代码（排除 §k）
                        if (MC_STYLES[code] && code !== '§k') {
                            if (!currentStyles.includes(MC_STYLES[code])) {
                                currentStyles.push(MC_STYLES[code]);
                            }
                            i += 2;
                            continue;
                        }

                        // §k 跳过
                        if (code === '§k') {
                            i += 2;
                            continue;
                        }

                        // 未知代码
                        currentText += escapeHtml(text[i]);
                        i++;
                    } else {
                        currentText += escapeHtml(text[i]);
                        i++;
                    }
                }

                // 🟢 输出最后攒的文本
                if (currentText) {
                    result += buildSpan(currentColor, currentStyles, currentText);
                }

                return result || escapeHtml(text);
            }

            function buildSpan(color, styles, text) {
                if (!text) return '';
                if (!color && styles.length === 0) return text;
                const styleParts = [];
                if (color) styleParts.push(`color:${color}`);
                styleParts.push(...styles);
                return `<span style="${styleParts.join(';')}">${text}</span>`;
            }

            // 🟢 自动填充上次保存的密码
            (function autoFillCredentials() {
                const savedUsername = localStorage.getItem('chat_username');
                const savedPassword = localStorage.getItem('chat_password');
                if (savedUsername) document.getElementById('loginUsername').value = savedUsername;
                if (savedPassword) document.getElementById('loginPassword').value = savedPassword;
            })();

            // 初始化
            checkAuth();

            loginBtn.addEventListener('click', handleLogin);
            document.getElementById('loginPassword').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            sendBtn.addEventListener('click', sendMessage);
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            async function checkAuth() {
                try {
                    const res = await fetch('https://map.qyserver.top/api/check-auth');
                    const data = await res.json();
                    if (data.code === 0 && data.data && data.data.username) {
                        currentUser = data.data.username;
                        showChatPanel();
                        startChatServices();
                    } else {
                        showLoginPanel();
                    }
                } catch (e) {
                    showLoginPanel();
                }
            }

            async function handleLogin() {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value.trim();
                if (!username || !password) {
                    showLoginError('请输入用户名和密码');
                    return;
                }
                loginBtn.disabled = true;
                loginError.style.display = 'none';
                try {
                    const res = await fetch('https://map.qyserver.top/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password }),
                        credentials: 'include'
                    });
                    const data = await res.json();
                    if (data.code === 0) {
                        showToast('登录成功！欢迎回来，' + currentUser + ' ~', 'success');
                        currentUser = data.data.username;
                        localStorage.setItem('chat_username', username);
                        localStorage.setItem('chat_password', password);
                        showChatPanel();
                        startChatServices();
                    } else {
                        showLoginError(data.message || '登录失败');
                    }
                } catch (e) {
                    showLoginError('网络错误，请稍后再试');
                } finally {
                    loginBtn.disabled = false;
                }
            }

            function showLoginError(msg) {
                loginError.textContent = msg;
                loginError.style.display = 'block';
            }

            function showLoginPanel() {
                loginPanel.style.display = 'flex';
                chatPanel.style.display = 'none';
                stopChatServices();
            }

            function showChatPanel() {
                loginPanel.style.display = 'none';
                chatPanel.style.display = 'flex';
            }

            function startChatServices() {
                fetchMessages();
                updateOnlineCounts();
                if (fetchTimer) clearInterval(fetchTimer);
                fetchTimer = setInterval(fetchMessages, FETCH_INTERVAL);
                onlineTimer = setInterval(updateOnlineCounts, 30000);
                heartbeatTimer = setInterval(() => {
                    fetch('https://map.qyserver.top/api/heartbeat').catch(() => { });
                }, HEARTBEAT_INTERVAL);
            }

            function stopChatServices() {
                if (fetchTimer) { clearInterval(fetchTimer); fetchTimer = null; }
                if (onlineTimer) { clearInterval(onlineTimer); onlineTimer = null; }
                if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
            }

            async function fetchMessages() {
                try {
                    const url = `https://map.qyserver.top/api/chat/fetch?lastRefeshTime=${lastRefreshTime}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (!Array.isArray(data) || data.length === 0) return;
                    data.forEach(msg => appendMessage(msg));
                    const maxTime = Math.max(...data.map(m => m.sendTime));
                    if (maxTime > lastRefreshTime) lastRefreshTime = maxTime;
                    scrollToBottom();
                } catch (e) {
                    console.error('获取消息失败:', e);
                }
            }

            async function sendMessage() {
                const msg = chatInput.value.trim();
                if (!msg) return;
                if (msg.length > 100) {
                    alert('消息长度不能超过100个字符');
                    return;
                }
                sendBtn.disabled = true;
                chatInput.disabled = true;
                try {
                    const res = await fetch('https://map.qyserver.top/api/chat/send', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ msg }),
                        credentials: 'include'
                    });
                    const data = await res.json();
                    if (data.code !== 0) {
                        alert(data.message || '发送失败');
                    } else {
                        chatInput.value = '';
                        await fetchMessages();
                    }
                } catch (e) {
                    alert('发送失败，请检查网络');
                } finally {
                    sendBtn.disabled = false;
                    chatInput.disabled = false;
                    chatInput.focus();
                }
            }

            /**
             * 处理消息内容，异步加载 [图片](url) 格式的图片
             * @param {string} text - 消息文本
             * @param {HTMLElement} container - 消息内容的容器元素
             */
            function processMessageContent(text, container) {
                // 正则匹配 [图片](url) 格式
                const imageRegex = /\[图片\]\((https?:\/\/[^\s)]+)\)/g;

                if (!imageRegex.test(text)) {
                    // 没有图片，直接设置文本
                    container.innerHTML = parseMcColors(text);
                    return;
                }

                // 重置正则
                imageRegex.lastIndex = 0;

                // 用占位符替换图片，然后异步加载
                let html = parseMcColors(text);

                // 找到所有图片 URL
                const imageMatches = [];
                let match;
                while ((match = imageRegex.exec(text)) !== null) {
                    imageMatches.push({
                        fullMatch: match[0],
                        url: match[1]
                    });
                }

                // 先显示加载中的占位符
                imageMatches.forEach((img, index) => {
                    const placeholder = `
                    <div class="img-placeholder" data-img-index="${index}" style="
                        display: inline-block;
                        background: #f0f0f0;
                        border-radius: 8px;
                        padding: 10px 15px;
                        margin: 5px 0;
                        font-size: 12px;
                        color: #999;
                    "><i class="fas fa-spinner fa-pulse"></i> 图片加载中...
                    </div>`;
                    html = html.replace(escapeHtml(img.fullMatch), placeholder);
                });

                container.innerHTML = html;

                // 异步加载图片
                imageMatches.forEach((img, index) => {
                    const placeholder = container.querySelector(`[data-img-index="${index}"]`);
                    if (!placeholder) return;

                    const imgElement = new Image();
                    imgElement.onload = function () {
                        placeholder.outerHTML = `
                            <div class="chat-image" style="
                                margin: 8px 0;
                                max-width: 300px;
                                border-radius: 10px;
                                overflow: hidden;
                                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                                cursor: pointer;
                            ">
                                <img src="${escapeHtml(img.url)}"
                                    referrerpolicy="no-referrer"
                                    style="width: 100%; height: auto; display: block;"
                                    alt="聊天图片"
                                    onclick="window.open('${escapeHtml(img.url)}', '_blank')"
                                >
                            </div>`;
                    };
                    imgElement.onerror = function () {
                        placeholder.outerHTML = `<span style="color:#e74c3c;font-size:12px;">
                            <i class="fas fa-exclamation-circle"></i> 图片加载失败
                        </span>`;
                    };
                    imgElement.src = img.url;
                });
            }

            // 修改 appendMessage 函数中的消息内容部分
            function appendMessage(msg) {
                const item = document.createElement('div');
                item.className = 'msg-item';

                if (msg.type === 'onJoin' || msg.type === 'onLeft') {
                    item.className = 'msg-item system';
                    const action = msg.type === 'onJoin' ? '加入了服务器' : '离开了服务器';
                    item.innerHTML = `<div class="msg-content">
                        <i class="fas fa-circle" style="font-size:6px;vertical-align:middle;margin-right:6px;color:#27ae60;"></i>
                        ${parseMcColors(msg.realName)} ${action}</div>`;
                } else if (msg.type === 'chat') {
                    if (msg.source === 'web' && msg.realName === currentUser) {
                        item.classList.add('self');
                    }
                    const time = new Date(msg.sendTime);
                    const timeStr = `${time.getHours().toString().padStart(2, '0')}:${time.getMinutes().toString().padStart(2, '0')}`;

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'msg-content';

                    // 🟢 异步处理图片
                    processMessageContent(msg.msg, contentDiv);

                    item.innerHTML = `
                        <div class="msg-meta">
                            <span class="name">${parseMcColors(msg.realName)}</span>
                            <span class="time">${timeStr}</span>
                        </div>`;

                    item.appendChild(contentDiv);
                }

                messagesEl.appendChild(item);
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function scrollToBottom() {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            /**
             * 右上角弹窗提示
             * @param {string} message - 提示文字
             * @param {string} type - 类型（'success' 绿色 / 'error' 红色）
             */
            function showToast(message, type) {
                // 移除旧的弹窗
                const old = document.querySelector('.chat-toast');
                if (old) old.remove();

                const toast = document.createElement('div');
                toast.className = 'chat-toast';
                toast.style.cssText = `
                    position: fixed;
                    top: 80px;
                    right: 20px;
                    z-index: 10000;
                    background: ${type === 'error' ? 'rgba(231, 76, 60, 0.9)' : 'rgba(39, 174, 96, 0.9)'};
                    color: #fff;
                    padding: 14px 24px;
                    border-radius: 10px;
                    font-size: 15px;
                    font-weight: 500;
                    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
                    backdrop-filter: blur(10px);
                    -webkit-backdrop-filter: blur(10px);
                    animation: chatToastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                    chatToastOut 0.4s ease 2.5s forwards;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                `;
                toast.innerHTML = `
                    <i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'check-circle'}"></i>
                    ${escapeHtml(message)}
                `;
                document.body.appendChild(toast);

                setTimeout(() => toast.remove(), 3000);
            }

            window.chatLogout = async function () {
                await fetch('https://map.qyserver.top/api/logout', { method: 'POST' });
                currentUser = null;
                lastRefreshTime = 0;
                messagesEl.innerHTML = '';
                localStorage.removeItem('chat_password');
                showLoginPanel();
            };
        })();
    </script>
    <script src="/lib/all.js"></script>
</body>

</html>
